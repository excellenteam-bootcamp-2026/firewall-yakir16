version: '3.8'

services:
  ts-service-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ts-service-dev
    env_file:
      - .env.dev
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs  